<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Expense Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #101114;
            color: white;
            margin: 0;
            padding: 24px 16px;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #a5a5b0;
            margin-bottom: 24px;
        }

        .card {
            background: #1b1c22;
            border: 1px solid #30313a;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .total-label {
            color: #b4b4c0;
            margin: 0 0 10px;
        }

        .total {
            font-size: 36px;
            font-weight: bold;
            margin: 0;
        }

        label {
            display: block;
            margin: 16px 0 8px;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
        }

        input, select {
            background: #101114;
            color: white;
            border: 1px solid #42434e;
        }

        button {
            margin-top: 18px;
            border: none;
            background: #8b7cff;
            color: #101114;
            font-weight: bold;
            cursor: pointer;
        }

        .expense {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #30313a;
            padding: 14px 0;
        }

        .expense:last-child {
            border-bottom: none;
        }

        .expense small {
            display: block;
            color: #a5a5b0;
            margin-top: 5px;
        }

        .delete-button {
            width: auto;
            margin: 0;
            padding: 8px 12px;
            background: #402126;
            color: #ffb6bf;
        }

        .empty {
            color: #a5a5b0;
            text-align: center;
            padding: 20px 0;
        }
        .date-time {
    text-align: center;
    margin: 12px 0 24px;
    padding: 14px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(167, 139, 250, 0.3);
    border-radius: 14px;
    box-shadow: 0 0 18px rgba(139, 92, 246, 0.08);
}

#current-date {
    color: #c4b5fd;
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 6px;
}

#current-time {
    color: #ffffff;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
}
/* Money Cat Hero Section */
.hero {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    margin-bottom: 28px;
    padding: 18px;
    background: linear-gradient(
        135deg,
        rgba(139, 92, 246, 0.15),
        rgba(20, 20, 30, 0.95)
    );
    border: 1px solid rgba(167, 139, 250, 0.3);
    border-radius: 20px;
}

.money-cat {
    width: 42%;
    max-width: 280px;
    height: 220px;
    object-fit: cover;
    object-position: center;
    border-radius: 16px;
    box-shadow: 0 0 24px rgba(139, 92, 246, 0.2);
}

.hero-text {
    flex: 1;
    min-width: 0;
}

.hero-text h1 {
    margin: 0 0 12px;
    font-size: 28px;
}

.hero-text p {
    margin: 8px 0;
    color: #c4b5fd;
    font-weight: 600;
}

.hero-text .tagline {
    color: #fbbf24;
    font-size: 14px;
}

/* Phone-friendly layout */
@media (max-width: 600px) {
    .hero {
    flex-direction: column;
    gap: 10px;
    padding: 12px;
    margin-bottom: 18px;
}

.money-cat {
    display: block;
    width: 100%;
    max-width: none;
    height: auto;
    max-height: 240px;
    object-fit: contain;
    object-position: center;
    border-radius: 12px;
}

    .hero-text {
        text-align: center;
        width: 100%;
    }

    .hero-text h1 {
        font-size: 24px;
    }
}
    </style>
</head>

<body>
    <main class="container">
        <div class="hero">
    <img
        src="money-cat.png"
        alt="Money cat wearing sunglasses with cash and black coffee"
        class="money-cat"
    >

    <div class="hero-text">
        <h1>💰 Expense Manager</h1>
        <p>More Expressoo, Less Depressoo ☕</p>
        <p class="tagline">Spend wisely. Stay cool. 🕶️</p>
    </div>
</div>
        
        <p class="subtitle">Know where your money goes.</p>

        <section class="card">
            <p class="total-label">Total Spending</p>
            <p class="total" id="total">₹0.00</p>
        </section>

        <section class="card">
            <h2>Add an Expense</h2>

            <form id="expense-form">
                <label for="item">Expense name</label>
                <input id="item" type="text"
                       placeholder="e.g. Lunch" required>

                <label for="amount">Amount (₹)</label>
                <input id="amount" type="number"
                       min="0.01" step="0.01"
                       placeholder="e.g. 150" required>

                <label for="category">Category</label>
                <select id="category">
                    <option>Food</option>
                    <option>Travel</option>
                    <option>Education</option>
                    <option>Shopping</option>
                    <option>Other</option>
                </select>

                <button type="submit">+ Add Expense</button>
            </form>
        </section>

        <section class="card">
            <h2>Your Expenses</h2>
            <div id="expense-list">
                <p class="empty">No expenses yet. Add your first one!</p>
            </div>
        </section>
    </main>
<script>
    const form = document.getElementById("expense-form");
    const itemInput = document.getElementById("item");
    const amountInput = document.getElementById("amount");
    const categoryInput = document.getElementById("category");
    const expenseList = document.getElementById("expense-list");
    const totalDisplay = document.getElementById("total");

    let expenses = JSON.parse(
    localStorage.getItem("expenses")
) || [];

    function renderExpenses() {
        expenseList.innerHTML = "";
        let total = 0;

        if (expenses.length === 0) {
            expenseList.innerHTML =
                '<p class="empty">No expenses yet. Add your first one!</p>';
        }

        expenses.forEach(function(expense) {
            total += expense.amount;

            const row = document.createElement("div");
            row.className = "expense";

            const details = document.createElement("div");

            const name = document.createElement("strong");
            name.textContent = expense.item;

            const category = document.createElement("small");
category.textContent = expense.category;

const dateTime = document.createElement("small");

dateTime.className = "expense-date";

dateTime.textContent = expense.timestamp
    ? new Date(expense.timestamp).toLocaleString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hour12: true
    })
    : "Older transaction";

details.append(name, category, dateTime);

            const rightSide = document.createElement("div");

            const amount = document.createElement("strong");
            amount.textContent = "₹" + expense.amount.toFixed(2);

            const deleteButton = document.createElement("button");
            deleteButton.className = "delete-button";
            deleteButton.textContent = "Delete";

            deleteButton.addEventListener("click", function() {
                expenses = expenses.filter(function(entry) {
                    return entry.id !== expense.id;
                });

                renderExpenses();
            });

            rightSide.append(amount, deleteButton);
            row.append(details, rightSide);
            expenseList.appendChild(row);
        });

        totalDisplay.textContent = "₹" + total.toFixed(2);
        localStorage.setItem(
    "expenses",
    JSON.stringify(expenses)
);
        localStorage.setItem(
    "expenses",
    JSON.stringify(expenses)
);
    }

    form.addEventListener("submit", function(event) {
        event.preventDefault();

        const item = itemInput.value.trim();
        const amount = Number(amountInput.value);
        const category = categoryInput.value;

        if (!item || !Number.isFinite(amount) || amount <= 0) {
            alert("Please enter a valid name and amount.");
            return;
        }
        expenses.push({
    id: Date.now() + Math.random(),
    item: item,
    amount: amount,
    category: category,
    timestamp: new Date().toISOString()
});

        renderExpenses();
        form.reset();
        itemInput.focus();
    });

    renderExpenses();
</script>
</body>
</html>
